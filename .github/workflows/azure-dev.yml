name: Azure Template Validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - azure.yaml
      - infra/**
      - agents/**
      - scripts/**
      - .github/workflows/azure-dev.yml

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deployment_contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML>=6,<7"
      - run: python -m unittest discover -s scripts -p test_deployment.py -v

  mcp_dependency_contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent: [clinical, coverage]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r agents/${{ matrix.agent }}/requirements.txt
      - run: python scripts/test_mcp_dependencies.py -v

  template_validation_job:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    name: template validation
    steps:
      # Step 1: Checkout the code from your repository
      - name: Checkout code
        uses: actions/checkout@v7

      # Step 2: Validate the Azure template using microsoft/template-validation-action
      - name: Validate Azure Template
        uses: microsoft/template-validation-action@bae4895d0a8abd4f0d5aad68ae8647b3027f4c91
        with:
          validateAzd: false
          useDevContainer: false
          validatePaths: "README.md, LICENSE, SECURITY.md, CONTRIBUTING.md, CODE_OF_CONDUCT.md, ISSUE_TEMPLATE, azure.yaml, infra, .devcontainer"
          securityAction: "None"
        id: validation
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Print the result of the validation
      - name: print result
        run: cat ${{ steps.validation.outputs.resultFile }}
